name: iOS TestFlight release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: 4ZS57MK3AP
      APP_BUNDLE_ID: com.lushlifelikenightflight.storeregilog
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release secrets
        shell: bash
        run: |
          required=(
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install dependencies
        run: npm ci

      - name: Build and sync iOS project
        run: npm run cap:sync:ios

      - name: Set unique build number
        shell: bash
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"

      - name: Install signing assets
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          EXPECTED_CERTIFICATE_SHA256="0E5B39D16166E76D8B3AC36A44CD054B0E58BF6BAAFCE9B0DA5E9B50BC6EA7C5"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          ACTUAL_CERTIFICATE_SHA256="$(shasum -a 256 "$CERTIFICATE_PATH" | awk '{ print toupper($1) }')"
          echo "Decoded distribution certificate SHA-256: $ACTUAL_CERTIFICATE_SHA256"
          if [[ "$ACTUAL_CERTIFICATE_SHA256" != "$EXPECTED_CERTIFICATE_SHA256" ]]; then
            echo 'Decoded distribution certificate does not match the locally verified p12.' >&2
            exit 1
          fi
          if ! openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -noout \
            -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD; then
            echo 'OpenSSL could not validate the decoded p12 with the stored password.' >&2
            exit 1
          fi
          echo 'Decoded p12 and stored password were validated by OpenSSL.'

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_DESTINATION="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$(dirname "$PROFILE_DESTINATION")"
          cp "$PROFILE_PATH" "$PROFILE_DESTINATION"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_DESTINATION=$PROFILE_DESTINATION" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive signed app
        shell: bash
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StoreRegiLog.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export IPA
        shell: bash
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_DIRECTORY="$RUNNER_TEMP/export"
          plutil -create xml1 "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/StoreRegiLog.xcarchive" \
            -exportPath "$EXPORT_DIRECTORY" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          IPA_PATH="$(find "$EXPORT_DIRECTORY" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo 'Export completed without producing an IPA.' >&2
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        shell: bash
        run: |
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IPA_PATH" \
            -apiKey "$APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            -v informational

      - name: Remove temporary signing assets
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "${PROFILE_DESTINATION:-}" ]]; then
            rm -f "$PROFILE_DESTINATION"
          fi
          if [[ -n "${API_KEY_PATH:-}" ]]; then
            rm -f "$API_KEY_PATH"
          fi
